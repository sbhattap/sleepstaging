[project]
name = "sleepstaging"
version = "0.1.0"
description = "Reproducible sleep staging from single-channel EEG on Sleep-EDF"
authors = [
    { name = "Subarna Bhattacharya", email = "sbhattap@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "braindecode>=1.8.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyriemann>=0.12",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "yasa>=0.8.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
